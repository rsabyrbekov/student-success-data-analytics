name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m src.generate_data
      - run: python -m src.data_quality --data data/synthetic/student_success.csv
      - run: python -m src.report --data data/synthetic/student_success.csv --output-dir reports
      - run: python -m compileall -q src
      - run: ruff check src tests
      - run: python -c "import nbformat; nbformat.read('notebooks/01_baseline_student_success.ipynb', as_version=4)"
      - run: pytest
