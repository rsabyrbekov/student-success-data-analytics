[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "student-success-data-analytics"
version = "0.1.0"
description = "Reproducible student success modeling examples"
requires-python = ">=3.10"
dependencies = [
  "jupyter>=1.0",
  "matplotlib>=3.7",
  "pandas>=2.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
