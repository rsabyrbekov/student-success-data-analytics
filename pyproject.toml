[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "student-success-data-analytics"
version = "0.1.0"
description = "Reproducible student success modeling examples"
requires-python = ">=3.10"
dependencies = [
  "jupyter>=1.0",
  "matplotlib>=3.7",
  "pandas>=2.0",
  "scikit-learn>=1.3",
]

[project.scripts]
student-success-check-data = "src.data_quality:main"
student-success-report = "src.report:main"

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6", "nbformat>=5.9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
